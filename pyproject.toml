[project]
name = "property-hunt"
version = "0.1.0"
description = "Personal Singapore landed property research tool"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pandas>=2.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
  "mcp>=1.2,<2",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_hunt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
